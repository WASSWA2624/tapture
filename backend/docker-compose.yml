services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tapture
      POSTGRES_PASSWORD: tapture
      POSTGRES_DB: tapture
  backend:
    build: .
    depends_on:
      - database
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://tapture:tapture@database:5432/tapture
      TOKEN_SECRET: replace-before-use
      RETENTION_DAYS: "30"
