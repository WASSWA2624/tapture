components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - invalid_credentials
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - rate_limited
                - quota_exceeded
                - internal
                - unavailable
            message: *a1
            details:
              type: object
              additionalProperties: true
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
          enum:
            - true
      required:
        - accepted
      additionalProperties: false
    TokenPair:
      type: object
      properties:
        accessToken: *a1
        refreshToken: *a1
        expiresIn: *a4
      required:
        - accessToken
        - refreshToken
        - expiresIn
      additionalProperties: false
    User:
      type: object
      properties:
        id: *a1
        organisationId: *a1
        email: *a1
        role: *a2
        status: *a5
      required:
        - id
        - organisationId
        - email
        - role
        - status
      additionalProperties: false
    UserPage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor: *a6
      required:
        - users
        - nextCursor
      additionalProperties: false
    Invitation:
      type: object
      properties:
        userId: *a1
        invitationToken: *a1
      required:
        - userId
        - invitationToken
      additionalProperties: false
    Device:
      type: object
      properties:
        id: *a1
        userId: *a1
        enrolledAt: *a1
        lastSeenAt: *a1
        revoked: *a3
      required:
        - id
        - userId
        - enrolledAt
        - lastSeenAt
        - revoked
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *a1
        organisationId: *a1
        name: *a1
        relayEnabled: *a3
        neverRelay: *a3
        retentionDays: *a7
      required:
        - id
        - organisationId
        - name
        - relayEnabled
        - neverRelay
        - retentionDays
      additionalProperties: false
    Membership:
      type: object
      properties:
        projectId: *a1
        userId: *a1
        contextScope: *a6
      required:
        - projectId
        - userId
        - contextScope
      additionalProperties: false
    Package:
      type: object
      properties:
        id: *a1
        projectId: *a1
        authorDeviceId: *a1
        byteSize: *a4
        createdAt: *a1
        expiresAt: *a1
        storageRef: *a1
      required:
        - id
        - projectId
        - authorDeviceId
        - byteSize
        - createdAt
        - expiresAt
        - storageRef
      additionalProperties: false
    PackagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Package'
        nextCursor: *a6
      required:
        - items
        - nextCursor
      additionalProperties: false
    AiEnvelope:
      type: object
      properties:
        instructions:
          type: string
        data:
          type: object
          additionalProperties: true
        media:
          type: array
          items:
            type: object
            properties:
              mimeType: *a1
              base64:
                type: string
            required:
              - mimeType
              - base64
            additionalProperties: false
        responseMimeType:
          type: string
          enum:
            - text/plain
            - application/json
      required:
        - instructions
        - data
        - media
        - responseMimeType
      additionalProperties: false
    AiRequest:
      type: object
      properties:
        projectId: *a1
        model: *a1
        payload:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/AiEnvelope'
      required:
        - projectId
        - model
        - payload
      additionalProperties: false
    AiResult:
      type: object
      properties:
        text: *a1
        model: *a1
      required:
        - text
        - model
      additionalProperties: false
    Usage:
      type: object
      properties:
        projectId: *a1
        userId: *a1
        model: *a1
        byteSize: *a4
        durationMs: *a4
        outcome:
          type: string
          enum:
            - reserved
            - ok
            - failed
        cost:
          type: number
          minimum: 0
        at: *a1
      required:
        - projectId
        - userId
        - model
        - byteSize
        - durationMs
        - outcome
        - cost
        - at
      additionalProperties: false
    Identity:
      type: object
      properties:
        userId: *a1
        organisationId: *a1
        role: *a2
        aiAvailable: *a3
        grants:
          type: array
          items:
            type: object
            properties:
              projectId: *a1
              contextScope: *a6
            required:
              - projectId
              - contextScope
            additionalProperties: false
        grantValidUntil: *a1
      required:
        - userId
        - organisationId
        - role
        - aiAvailable
        - grants
        - grantValidUntil
      additionalProperties: false
    Metrics:
      type: object
      properties:
        requests:
          type: object
          additionalProperties:
            type: object
            properties:
              count: *a4
              errors: *a4
              latencyMs:
                type: number
                minimum: 0
            required:
              - count
              - errors
              - latencyMs
            additionalProperties: false
        packagesStored: *a4
        packagesAcked: *a4
        packagesPurged: *a4
        storageBytes:
          type: object
          additionalProperties: *a4
        aiRequests: *a4
        aiCost:
          type: number
          minimum: 0
        authFailures: *a4
      required:
        - requests
        - packagesStored
        - packagesAcked
        - packagesPurged
        - storageBytes
        - aiRequests
        - aiCost
        - authFailures
      additionalProperties: false
  responses:
    Error:
      description: Typed safe error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
