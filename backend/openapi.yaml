  /api/v1/ai/extract:
    post:
      description: 'Authenticated request-lifetime analysis. Legacy
        projectId/model/payload requests remain supported. Optional processing
        v1 binds revision, record, exact decoded payload hash and idempotency
        key to actor/device/project/operation/model/provider/billing. Send a
        base64 UTF-8 envelope to preserve exact hash bytes between JSON
        encoders. Concurrent active duplicates share one operation;
        completed/uncertain receipts never dispatch or charge again. Responses
        are never persisted; after completion/restart, replay returns
        ai_result_unavailable or ai_request_uncertain and requires device
        recovery or explicit approval of a new attempt. Optional billing selects
        managed/personal Gemini/OpenAI explicitly; omission selects configured
        managed billing. No provider/account fallback. New versioned or personal
        requests never automatically retry after dispatch. Only allowlisted
        escalation models with approved maxCost are accepted. Quotas reserve
        configured conservative cost before provider calls; token usage is
        reported when returned by the provider.'
      responses:
        '200':
          description: Pass-through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
