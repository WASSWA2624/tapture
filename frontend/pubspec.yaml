name: tapture
description: "Tapture — local-first field data capture for Android."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Local plugin packages (frontend/.rules/01-structure.md FE-STR-01). Each is a
# workspace member and a pinned path dependency below.
workspace:
  - packages/tapture_whisper

dependencies:
  archive: ^4.3.0
  battery_plus: ^7.1.2
  camera: 0.12.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  cupertino_icons: ^2.0.0
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Keep this migration-capable v10 release for at least one production cycle
  # before moving to v11, which removes the legacy Android cipher migration.
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.1
  go_router: ^17.5.0
  geolocator: 14.1.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_face_detection: 0.15.1
  google_sign_in: 7.2.0
  image: ^4.10.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  local_auth: 3.0.2
  local_auth_android: 2.2.0
  local_auth_darwin: 2.0.4
  mobile_scanner: 7.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  record: ^7.1.1
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  sqlite3: ^3.5.2
  tapture_whisper:
    path: packages/tapture_whisper
    version: 1.9.4+1
  url_launcher: 6.3.3
  pdf: 3.13.1
  pdfrx: 2.4.8
  xml: 7.0.1

dev_dependencies:
  analyzer: 13.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - tool/secret_patterns.yaml
    - assets/branding/
    - assets/ai_providers/
    - assets/feedback/
    - assets/fonts/
    - assets/speech/
    - assets/templates/
