name: tapture
description: "Tapture — local-first field data capture for Android."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  drift: '>=2.31.0 <2.32.0'
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^9.2.4
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: '>=2.31.0 <2.32.0'
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0

# flutter_secure_storage_windows pulls path_provider. Current
# path_provider_android / path_provider_foundation run native build hooks that
# prefix every `dart run tool/…` with "Running build hooks...", which breaks
# the guardrail checkers' stdout contract. These pins restore plugin-channel
# implementations without JNI or FFI hooks.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
