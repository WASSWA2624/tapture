org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# sqlite3_flutter_libs still fetches AGP 8.7.3 on its own classpath. A
# stalled Google Maven lookup then fails the whole APK (see run-tools).
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Kotlin plugins (speech_to_text, image_picker_android) compile from the pub
# cache on C: into build/ on D:. Kotlin's incremental caches cannot relate
# files on two drives and fail the build with "Could not close incremental
# caches", so plugins always compile in full (a few seconds).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
