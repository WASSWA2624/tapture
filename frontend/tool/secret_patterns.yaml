# Named secret shapes. check_logging.dart, check_secrets.dart, the logger's
# redaction and the log-export test all read this file. A match is reported by
# the name on the left; the matched text is never written to the report.
# Patterns are compiled case-insensitively.

patterns:
  provider_key:
    description: A compiled-in cloud or AI provider key.
    pattern: '\b(?:sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|AKIA[A-Z0-9]{16})'
  bearer_token:
    description: An Authorization bearer token.
    pattern: '\bbearer\s+[A-Za-z0-9._~+/=-]{16,}'
  private_key:
    description: A PEM private key header.
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
  connection_string:
    description: A connection string that embeds a password.
    pattern: '\b(?:postgres(?:ql)?|mysql|mongodb|redis|amqp)://[^/\s:]+:[^@\s]+@'
  long_base64:
    description: A long base64 blob that is likely a key or token.
    pattern: '(?:^|[^A-Za-z0-9+/=])[A-Za-z0-9+/]{80,}={0,2}(?:$|[^A-Za-z0-9+/=])'
