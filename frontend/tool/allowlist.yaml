# Approved direct dependencies for the Tapture Flutter application
# (dev-plan 01-orchestration/005).
#
# A package reaches this file the way frontend/.rules/13-workflow.md FE-FLOW-06
# says it must: its own task, a pinned version, a licence check and a note on
# what it replaces. Editing pubspec.yaml without editing this file fails
# tool/check_dependencies.dart, which is the point — a dependency is a decision
# somebody has to make on purpose.
#
# Every entry carries the version pubspec.yaml must ask for, what the package
# is for, and the task that introduced it. `sdk` is the version of a package
# that ships with the Flutter SDK rather than from pub.dev.
packages:
  flutter:
    version: sdk
    purpose: The Flutter framework the application is built on.
    task: "001"
  flutter_riverpod:
    version: ^3.4.3
    purpose: ProviderScope and ConsumerWidget — the only state library (FE-STATE-01). Replaces nothing; this is the first approved state package.
    task: "019"
  crypto:
    version: ^3.0.7
    purpose: Incremental SHA-256 for file identity and duplicate detection (FE-PERF-07). Replaces a hand-rolled digest.
    task: "024"
  cupertino_icons:
    version: ^1.0.9
    purpose: The CupertinoIcons font the Flutter framework itself names. No Tapture code imports Cupertino, but Material pulls the adaptive text-selection and magnifier widgets in, so the compiled app carries IconData pointing at a font that was not bundled and the APK build warned about every one of them. MIT, flutter.dev. Replaces shipping a build that names glyphs it does not carry; icon tree-shaking keeps only the few the framework reaches.
    task: "332"
  connectivity_plus:
    version: ^7.3.1
    purpose: Platform radio state (online / metered / offline). Reached only through connectivity_service (FE-STR-11). Replaces a hand-rolled reachability check.
    task: "025"
  permission_handler:
    version: ^12.0.3
    purpose: Runtime camera, microphone, location and storage requests. Reached only through permissions_service (FE-STR-11). Replaces a hand-rolled permission channel.
    task: "026"
  record:
    version: ^7.1.1
    purpose: Streams microphone evidence through AudioRecorderService into the atomic project FileWriter. BSD-3-Clause. Replaces the unavailable production recorder stand-in.
    task: "062"
  share_plus:
    version: ^13.3.0
    purpose: System share/open chooser for a file copy on Android and iOS, reached only through DownloadService.openExternally (FE-STR-11). BSD-3-Clause. Replaces adding open_file or url_launcher for the same hand-off.
    task: "330"
  flutter_secure_storage:
    version: ^10.3.4
    purpose: Platform Keystore/Keychain for keys and credentials. Reached only through secure_storage (FE-STR-11, FE-SEC-01). Replaces writing secrets to preferences or the database.
    task: "027"
  go_router:
    version: ^17.5.0
    purpose: One declared route table, typed helpers and a single redirect chain (FE-STR-02). Replaces the MaterialApp.router placeholder in task 019. BSD-3-Clause. Capped below 18 because 18 pulls material_ui that needs @awaitNotRequired, which Dart 3.12.2 does not have.
    task: "072"
  json_annotation:
    version: ^4.9.0
    purpose: JsonConverter and @JsonKey so models declare wire names explicitly (FE-CODE-13). Replaces hand-rolled codecs that would follow Dart identifiers.
    task: "028"
  build_runner:
    version: ^2.4.13
    purpose: Runs json_serializable (and later Drift) so generated output is committed (FE-CODE-13). Replaces invoking the generator by hand.
    task: "028"
  json_serializable:
    version: ^6.9.0
    purpose: Generates fromJson/toJson using @JsonKey names from build.yaml. Replaces deriving wire keys from Dart field names.
    task: "028"
  drift:
    version: ">=2.31.0 <2.32.0"
    purpose: Typed SQLite access, lazy WAL connections and the MigrationStrategy later table tasks extend (FE-CODE-13). Replaces raw sqlite3 and an unversioned schema. Capped below 2.32 because 2.32+ needs sqlite3 3.x native assets that prefix dart run stdout, and newer drift_dev conflicts with json_serializable 6.9.0.
    task: "049"
  drift_dev:
    version: ">=2.31.0 <2.32.0"
    purpose: Generates AppDatabase and companions so Drift output is committed (FE-CODE-13). Replaces writing the .g.dart by hand.
    task: "049"
  path_provider:
    version: ^2.1.5
    purpose: Application support directory for the database file. Replaces a hardcoded platform path.
    task: "049"
  sqlite3:
    version: ^2.9.4
    purpose: Typed setup callback that turns WAL and foreign keys on for each native connection. Replaces an untyped pragma runner.
    task: "049"
  sqlite3_flutter_libs:
    version: ^0.5.42
    purpose: Bundles SQLite with the Flutter app so NativeDatabase opens on device. Replaces depending on a system sqlite3.
    task: "049"
  intl:
    version: ^0.20.2
    purpose: Locale-aware date, time and number formatting for catalogue fields (FE-L10N-04, FE-CONS-09). Replaces hand-built day/month/year strings.
    task: "035"
  archive:
    version: ^3.6.1
    purpose: Pure-Dart ZIP writing (and reading, in tests) behind core/export's XLSX encoder, so a workbook builds on the web as well as on device. MIT. Replaces a hand-rolled ZIP container and CRC. Capped at 3.x because that is the release already in the offline cache this build runs from; task 205 reuses it for the data package.
    task: "282"
  speech_to_text:
    version: ^7.5.0
    purpose: On-device and platform speech recognition behind core/ai/stt_service (FE-STR-11), so every free-text field can take dictation. BSD-3-Clause. Replaces a hand-rolled Android/iOS/web recogniser channel. Raised to 7.5 in task 332 because 7.4 applies the Kotlin Gradle Plugin, which the Android build warns a future Flutter will reject; 7.5 uses built-in Kotlin and needs exactly the Flutter 3.44 / Dart 3.12 this project pins.
    task: "283"
  image_picker:
    version: ^1.2.3
    purpose: Camera and photo-library picks behind core/files/photo_picker (FE-STR-11), so feedback can attach device photos on Android, iOS, web and desktop. BSD-3-Clause, flutter.dev. Replaces a hand-rolled browser file input that left native builds with no camera or library.
    task: "283"
  flutter_test:
    version: sdk
    purpose: The widget and unit test harness every guardrail suite runs on.
    task: "001"
  flutter_lints:
    version: ^6.0.0
    purpose: The shared lint set analysis_options.yaml layers its rules onto.
    task: "003"
  image:
    version: ^4.3.0
    purpose: Pure-Dart decode, resize, orientation and contrast for off-thread preparation and the deterministic desktop/test OCR fallback (FE-PERF-02). MIT. Replaces a native image pipeline the test VM cannot run.
    task: "013"
  google_mlkit_text_recognition:
    version: ^0.17.1
    purpose: Native on-device Latin-script OCR on Android and iOS, including text blocks and bounding boxes. MIT. Replaces the synthetic fixed-font recogniser that could not read field photographs.
    task: "013"
  flutter_local_notifications:
    version: ^18.0.1
    purpose: One local notification when a processing batch finishes. BSD-3-Clause. Replaces a hand-rolled notification channel. No push and no remote service.
    task: "013"
