# Approved direct dependencies for the Tapture Flutter application
# (dev-plan 01-orchestration/005).
#
# A package reaches this file the way frontend/.rules/13-workflow.md FE-FLOW-06
# says it must: its own task, a pinned version, a licence check and a note on
# what it replaces. Editing pubspec.yaml without editing this file fails
# tool/check_dependencies.dart, which is the point — a dependency is a decision
# somebody has to make on purpose.
#
# Every entry carries the version pubspec.yaml must ask for, what the package
# is for, and the task that introduced it. `sdk` is the version of a package
# that ships with the Flutter SDK rather than from pub.dev.
packages:
  flutter:
    version: sdk
    purpose: The Flutter framework the application is built on.
    task: "001"
  flutter_riverpod:
    version: ^3.4.3
    purpose: ProviderScope and ConsumerWidget — the only state library (FE-STATE-01). Replaces nothing; this is the first approved state package.
    task: "019"
  crypto:
    version: ^3.0.7
    purpose: Incremental SHA-256 for file identity and duplicate detection (FE-PERF-07). Replaces a hand-rolled digest.
    task: "024"
  connectivity_plus:
    version: ^7.3.1
    purpose: Platform radio state (online / metered / offline). Reached only through connectivity_service (FE-STR-11). Replaces a hand-rolled reachability check.
    task: "025"
  permission_handler:
    version: ^12.0.3
    purpose: Runtime camera, microphone, location and storage requests. Reached only through permissions_service (FE-STR-11). Replaces a hand-rolled permission channel.
    task: "026"
  flutter_secure_storage:
    version: ^9.2.4
    purpose: Platform Keystore/Keychain for keys and credentials. Reached only through secure_storage (FE-STR-11, FE-SEC-01). Replaces writing secrets to preferences or the database.
    task: "027"
  json_annotation:
    version: ^4.9.0
    purpose: JsonConverter and @JsonKey so models declare wire names explicitly (FE-CODE-13). Replaces hand-rolled codecs that would follow Dart identifiers.
    task: "028"
  build_runner:
    version: ^2.4.13
    purpose: Runs json_serializable (and later Drift) so generated output is committed (FE-CODE-13). Replaces invoking the generator by hand.
    task: "028"
  json_serializable:
    version: ^6.9.0
    purpose: Generates fromJson/toJson using @JsonKey names from build.yaml. Replaces deriving wire keys from Dart field names.
    task: "028"
  intl:
    version: ^0.20.2
    purpose: Locale-aware date, time and number formatting for catalogue fields (FE-L10N-04, FE-CONS-09). Replaces hand-built day/month/year strings.
    task: "035"
  flutter_test:
    version: sdk
    purpose: The widget and unit test harness every guardrail suite runs on.
    task: "001"
  flutter_lints:
    version: ^6.0.0
    purpose: The shared lint set analysis_options.yaml layers its rules onto.
    task: "003"
