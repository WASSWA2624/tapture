name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check development tracker is committed and current
        run: dart run tool/sync_dev_tracker.dart --check
      - name: Resolve the change base
        id: base
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$VERIFY_BASE" ] && [ "$VERIFY_BASE" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=$VERIFY_BASE" >> "$GITHUB_OUTPUT"
          else
            git fetch origin "$DEFAULT_BRANCH" --depth=1
            echo "sha=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")" >> "$GITHUB_OUTPUT"
          fi
      - run: dart run tool/verify.dart --changed
        env:
          VERIFY_BASE: ${{ steps.base.outputs.sha }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: frontend/**/failures/**
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backend.yml',
              head_sha: context.sha,
              per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.info('No backend workflow on this commit.');
              return;
            }
            if (run.conclusion !== 'success' && run.status !== 'in_progress' && run.status !== 'queued') {
              core.setFailed(`backend workflow is ${run.conclusion || run.status}`);
            }
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the signed release
        working-directory: frontend
        env:
          TAPTURE_KEYSTORE: ${{ secrets.TAPTURE_KEYSTORE }}
          TAPTURE_STORE_PASSWORD: ${{ secrets.TAPTURE_STORE_PASSWORD }}
          TAPTURE_KEY_ALIAS: ${{ secrets.TAPTURE_KEY_ALIAS }}
          TAPTURE_KEY_PASSWORD: ${{ secrets.TAPTURE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAPTURE_KEYSTORE" ]; then
            echo "Release signing key is not configured; skipping the artefact."
            exit 0
          fi
          flutter build apk --release --flavor prod --split-per-abi
